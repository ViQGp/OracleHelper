# ============================================================
# OracleHelper Windows EXE 自动编译工作流
# 重要提醒：
# 1. 不要上传 ZIP 压缩包！直接上传解压后的 src/、thirdparty/ 文件夹
# 2. 仓库根目录必须存在：src/main.cpp、src/kissfft.c、thirdparty/kissfft/kiss_fft.h、CMakeLists.txt
# 3. 本工具仅限听障玩家无障碍辅助使用，遵守 Bungie 服务条款
# ============================================================
name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 支持手动触发编译

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release

    steps:
    # ---------- 步骤1：拉取仓库代码 ----------
    - name: Checkout Repository
      uses: actions/checkout@v6  # Node.js 24 兼容版本
      with:
        fetch-depth: 0  # 完整拉取代码，避免文件缺失

    # ---------- 步骤2：列出仓库结构（方便排错） ----------
    - name: List Repository Structure
      shell: cmd
      run: |
        echo ========== 仓库根目录 ==========
        dir /b
        echo ========== src 目录 ==========
        dir /b src || echo ❌ src 目录不存在！
        echo ========== thirdparty/kissfft 目录 ==========
        dir /b thirdparty\kissfft || echo ❌ kissfft 目录不存在！

    # ---------- 步骤3：校验必需文件（核心排错步骤） ----------
    - name: Verify Required Files
      shell: cmd
      run: |
        set ERROR_FLAG=0
        if not exist "src\main.cpp" (
          echo ::error::❌ 缺失文件：src/main.cpp
          set ERROR_FLAG=1
        )
        if not exist "src\kissfft.c" (
          echo ::error::❌ 缺失文件：src/kissfft.c
          set ERROR_FLAG=1
        )
        if not exist "thirdparty\kissfft\kiss_fft.h" (
          echo ::error::❌ 缺失文件：thirdparty/kissfft/kiss_fft.h
          set ERROR_FLAG=1
        )
        if not exist "CMakeLists.txt" (
          echo ::error::❌ 缺失文件：CMakeLists.txt
          set ERROR_FLAG=1
        )
        if "%ERROR_FLAG%"=="1" (
          echo ::error::请上传缺失的文件后重试！
          exit /b 1
        )
        echo ✅ 所有必需文件校验通过！

    # ---------- 步骤4：配置MSVC编译环境 ----------
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v3  # Node.js 24 兼容版本

    # ---------- 步骤5：CMake配置 ----------
    - name: Configure CMake
      shell: cmd
      run: |
        echo ========== 开始CMake配置 ==========
        cmake -B build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -Wno-dev
        if errorlevel 1 (
          echo ::error::CMake配置失败！
          exit /b 1
        )

    # ---------- 步骤6：编译Release版本 ----------
    - name: Build Release
      shell: cmd
      run: |
        echo ========== 开始编译 ==========
        cmake --build build ^
          --config %BUILD_TYPE% ^
          --verbose > build_log.txt 2>&1
        type build_log.txt
        if errorlevel 1 (
          echo ::error::编译失败！查看上方日志定位错误
          exit /b 1
        )
        echo ✅ 编译成功！

    # ---------- 步骤7：列出编译产物 ----------
    - name: List Build Output
      shell: cmd
      run: |
        echo ========== 编译产物目录 ==========
        dir /b build\Release
        if not exist "build\Release\OracleHelper.exe" (
          echo ::error::❌ OracleHelper.exe 未生成！
          exit /b 1
        )

    # ---------- 步骤8：上传编译好的EXE ----------
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v7  # Node.js 24 兼容版本
      with:
        name: OracleHelper-Windows-EXE
        path: build/Release/OracleHelper.exe
        if-no-files-found: error  # 没找到EXE直接报错
