steps:
  # ---------- 步骤1：拉取代码 ----------
  - name: Checkout repository
    uses: actions/checkout@v4

  # ---------- 步骤2：校验必需文件 ----------
  - name: Verify required files
    shell: cmd
    run: |
      echo Verifying project files...
      if not exist "src\main.cpp" (
        echo ::error::❌ 缺失文件：src/main.cpp
        exit /b 1
      )
      if not exist "src\kissfft.c" (
        echo ::error::❌ 缺失文件：src/kissfft.c
        exit /b 1
      )
      if not exist "thirdparty\kissfft\kiss_fft.h" (
        echo ::error::❌ 缺失文件：thirdparty/kissfft/kiss_fft.h
        exit /b 1
      )
      if not exist "CMakeLists.txt" (
        echo ::error::❌ 缺失文件：CMakeLists.txt
        exit /b 1
      )
      echo ✅ 所有必需文件校验通过！

  # ---------- 步骤3：官方标准初始化 MSVC 环境（核心修复！）----------
  # 官方 action 会自动调用 vcvars64.bat 并配置好所有环境变量
  - name: Setup MSVC
    uses: microsoft/setup-msvc@v2
    with:
      msbuild-versions: latest  # 确保使用最新版的 VS Build Tools

  # ---------- 步骤4：CMake 配置 ----------
  - name: Configure CMake
    shell: cmd
    run: |
      echo ========== 开始 CMake 配置 ==========
      cmake -B build ^
        -G "Visual Studio 17 2022" ^
        -A x64 ^
        -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
        -Wno-author
      if errorlevel 1 (
        echo ::error::CMake 配置失败！
        exit /b 1
      )
      echo ✅ CMake 配置成功！

  # ---------- 步骤5：编译 Release 版本 ----------
  - name: Build Release
    shell: cmd
    run: |
      echo ========== 开始编译 ==========
      cmake --build build ^
        --config %BUILD_TYPE% ^
        --parallel
      if errorlevel 1 (
        echo ::error::编译失败！
        exit /b 1
      )
      echo ✅ 编译成功！

  # ---------- 步骤6：检查并上传产物 ----------
  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: OracleHelper-Windows-EXE
      path: build/Release/OracleHelper.exe
